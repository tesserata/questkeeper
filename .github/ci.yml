name: ci

on:
  push:
    branches: [ main ]
    paths:
      - 'libs/**'
      - 'services/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'libs/**'
      - 'services/**'
      - '.github/workflows/**'

jobs:
  build_libs:
    name: Build internal wheels (libs/*)
    runs-on: ubuntu-latest
    outputs:
      wheels_key: ${{ steps.hash.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - id: hash
        run: |
          echo "key=wheels-${{ hashFiles('libs/**/pyproject.toml', 'libs/**/src/**') }}" >> $GITHUB_OUTPUT

      - name: Restore wheels cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .wheels
          key: ${{ steps.hash.outputs.key }}

      - name: Build wheels (only if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.4.0 hatchling build
          rm -rf .wheels && mkdir -p .wheels
          uv build libs/render
          uv build libs/common
          cp libs/render/dist/*.whl .wheels/
          cp libs/common/dist/*.whl .wheels/

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.hash.outputs.key }}
          path: .wheels/*.whl
          if-no-files-found: error

  build_services:
    name: Build & push services
    needs: build_libs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ bot, api_gateway, domain, worker ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_libs.outputs.wheels_key }}
          path: services/${{ matrix.service }}/.wheels

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            WHEELS_DIR=services/${{ matrix.service }}/.wheels
          cache-from: type=gha
          cache-to: type=gha,mode=max