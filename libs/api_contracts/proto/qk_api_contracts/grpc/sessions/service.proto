syntax = "proto3";

package questkeeper.v1.sessions;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "qk_api_contracts/grpc/common.proto";
import "qk_api_contracts/grpc/sessions/models.proto";

service Sessions {
  // commands
  rpc CreateSession(models.SessionInfo) returns (models.Session);
  rpc EditBasics(EditBasicsRequest) returns (models.Session);
  rpc EditSchedule(EditScheduleRequest) returns (models.Session);
  rpc EditCapacity(EditCapacityRequest) returns (models.Session);
  rpc EditOrganization(EditOrganizationRequest) returns (models.Session);
  rpc EditGM(EditGMRequest) returns (models.Session);
  rpc PublishSession(SessionOperationRequest) returns (models.Session);
  rpc CancelSession(SessionOperationRequest) returns (models.Session);

  // queries
  rpc GetSession(GetSessionRequest) returns (models.Session);
  rpc GetSessionView(GetSessionRequest) returns (models.SessionView);
  rpc GetSessionSummary(GetSessionRequest) returns (models.SessionSummary);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

service Signups {
  rpc SignupToSession(models.SignupInfo) returns (models.Signup);
  rpc SwitchReserve(SignupOperationRequest) returns (models.Signup);
  rpc SwitchMain(SignupOperationRequest) returns (models.Signup);
  rpc SignOut(SignupOperationRequest) returns (google.protobuf.Empty);
  rpc SetCharacter(SetCharacterRequest) returns (models.Signup);
}

// --- session commands ---

message EditBasicsRequest {
  string session_id = 1;
  string title = 2;
  string summary = 3;
  string system = 4;

  uint64 expected_version = 5;
}

message EditScheduleRequest {
  string session_id = 1;
  google.protobuf.Timestamp time = 2;
  int32 duration_minutes = 3;

  uint64 expected_version = 5;
}

message EditOrganizationRequest {
  string vtt_link = 1;
  string location = 2;
  repeated string additional_links = 3;

  uint64 expected_version = 4;
}

message EditCapacityRequest {
  string session_id = 1;
  int32 capacity = 2;

  uint64 expected_version = 3;
}

message EditGMRequest {
  string session_id = 1;
  int64 gm_user_id = 2;

  uint64 expected_version = 3;
}

message SessionOperationRequest {
  string session_id = 1;

  uint64 expected_version = 2;
}

// --- signup commands ---
message SignupOperationRequest {
  string session_id = 1;
  string user_id = 2;
}

message SetCharacterRequest {
  string session_id = 1;
  string user_id = 2;
  string character_id = 3;
}

// --- session queries ---

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  string server_id = 1;
  int64 gm_user_id = 2;
  int64 user_id = 3;
  string system = 4;
  string event_id = 5;
  string status = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;

  common.PageRequest page = 9;
}

message ListSessionsResponse {
  repeated models.SessionSummary items = 1;
  common.Page page = 2;
}