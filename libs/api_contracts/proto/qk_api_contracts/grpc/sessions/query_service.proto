syntax = "proto3";

package questkeeper.sessions;

import "google/protobuf/timestamp.proto";
import "qk_api_contracts/grpc/common.proto";
import "qk_api_contracts/grpc/sessions/models.proto";

// --- queries service (read models/projections)
service SessionsQuery {
  rpc GetSession(GetSessionRequest) returns (models.Session);
  rpc GetSessionView(GetSessionRequest) returns (models.SessionView);
  rpc GetSessionSummary(GetSessionRequest) returns (models.SessionSummary);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

// --- requests ---

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  string server_id = 1;
  int64 gm_user_id = 2;
  int64 user_id = 3;
  string system = 4;
  string event_id = 5;
  string status = 6;
  google.protobuf.Timestamp start = 7;
  google.protobuf.Timestamp end = 8;

  common.PageRequest page = 9;
}

message ListSessionsResponse {
  repeated models.SessionSummary items = 1;
  common.Page page = 2;
}