syntax = "proto3";

package questkeeper.worker;

import "sessions/models.proto";
import "events/models.proto";

// worker-only API
service Worker {
  rpc SetSessionMessageId(SetMessageIdRequest) returns (sessions.models.Session);
  rpc SetEventMessageId(SetMessageIdRequest) returns (events.models.Event);
}

message SetMessageIdRequest {
  string session_id = 1;
  string message_id = 2;
  uint64 expected_version = 3;
}
