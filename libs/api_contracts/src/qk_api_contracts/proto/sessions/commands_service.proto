syntax = "proto3";

package questkeeper.sessions.commands_service;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "sessions/models.proto";

// --- domain commands service (write) ---
service SessionCommands {
  // session lifecycle
  rpc CreateSession(models.SessionInfo) returns (models.Session);
  rpc EditBasics(EditBasicsRequest) returns (models.Session);
  rpc EditSchedule(EditScheduleRequest) returns (models.Session);
  rpc EditCapacity(EditCapacityRequest) returns (models.Session);
  rpc EditOrganization(EditOrganizationRequest) returns (models.Session);
  rpc EditGM(EditGMRequest) returns (models.Session);
  rpc PublishSession(PublishSessionRequest) returns (models.Session);
  rpc CancelSession(CancelSessionRequest) returns (models.Session);
}

service SignupCommands {
  rpc Signup(models.SignupInfo) returns (models.Signup);
  rpc SwitchReserve(SwitchReserveRequest) returns (models.Signup);
  rpc SwitchMain(SwitchMainRequest) returns (models.Signup);
  rpc SignOut(SignOutRequest) returns (google.protobuf.Empty);
  rpc SetCharacter(SetCharacterRequest) returns (models.Signup);
}

// --- session commands ---

// edit

message EditBasicsRequest {
  string session_id = 1;
  string title = 2;
  string summary = 3;
  string system = 4;

  uint64 expected_version = 5;
}

message EditScheduleRequest {
  string session_id = 1;
  google.protobuf.Timestamp time = 2;
  int32 duration_minutes = 3;

  uint64 expected_version = 5;
}

message EditOrganizationRequest {
  string vtt_link = 1;
  string location = 2;
  repeated string additional_links = 3;

  uint64 expected_version = 4;
}

message EditCapacityRequest {
  string session_id = 1;
  int32 capacity = 2;

  uint64 expected_version = 3;
}

message EditGMRequest {
  string session_id = 1;
  int64 gm_user_id = 2;

  uint64 expected_version = 3;
}

// publish session

message PublishSessionRequest {
  string session_id = 1;

  uint64 expected_version = 2;
}

// cancel session

message CancelSessionRequest {
  string session_id = 1;

  uint64 expected_version = 2;
}

// --- signup commands ---

message SwitchReserveRequest {
  string session_id = 1;
  string user_id = 2;
}

message SwitchMainRequest {
  string session_id = 1;
  string user_id = 2;
}

message SignOutRequest {
  string session_id = 1;
  string user_id = 2;
}

message SetCharacterRequest {
  string session_id = 1;
  string user_id = 2;
  string character_id = 3;
}