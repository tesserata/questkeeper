syntax = "proto3";

package questkeeper.sessions.models;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "characters/models.proto";


// write input (client -> server)
message SessionInfo {
  int64 server_id = 1;
  string event_id = 2;
  string title = 3;
  string summary = 4;
  string system = 5;
  int64 gm_user_id = 6;

  string vtt_link = 7;
  string location = 8;
  repeated string additional_links = 9;

  google.protobuf.Timestamp time = 10;
  int32 duration_minutes = 11;

  int32 capacity = 12;
  repeated string role_mentions = 13;
}

message SignupInfo {
  string session_id = 1;
  int64 user_id = 2;
  string character_id = 3;
  string seat = 4;
}

// resource (server -> client)
message Session {
  string session_id = 1;
  SessionInfo info = 2;

  int64 channel_id = 3;
  int64 message_id = 4;
  string status = 5;

  common.VersionHeader version = 6;
}

message Signup {
  SignupInfo info = 1;

  common.VersionHeader version = 2;
}

// summary (UI-friendly projection)
message SessionSummary { // manual field selection to optimize data sent
  string title = 1;
  string game_system = 2;
  int64 gm_user_id = 3;

  string status = 4;
  google.protobuf.Timestamp time = 5;
  int32 capacity = 6;
  int32 seats_taken = 7;

  int64 server_id = 8;
  int64 channel_id = 9;
  int64 message_id = 10;

  string session_id = 11;
  common.VersionHeader version = 12;
}

// view (UI-friendly projection)
message SessionView {
  Session session = 1;
  int32 seats_taken = 2;
  repeated SignupView main_signups = 3;
  repeated SignupView reserve_signups = 4;
}

message SignupView {
  string user_id = 1;
  characters.models.CharacterSummary character = 2;
}