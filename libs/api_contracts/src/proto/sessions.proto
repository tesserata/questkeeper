syntax = "proto3";

package questkeeper.sessions;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "enums.proto";
import "signups.proto";

// ---------- Service ----------
service SessionService {
  // GET /sessions/
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // POST /sessions/
  rpc CreateSession(CreateSessionRequest) returns (SessionResponse);
  // GET /sessions/{session_id}
  rpc GetSession(GetSessionRequest) returns (SessionResponse);
  // PATCH /sessions/{session_id}
  rpc UpdateSession(UpdateSessionRequest) returns (SessionResponse);
  // DELETE /sessions/{session_id}
  rpc DeleteSession(DeleteSessionRequest) returns (SessionResponse);

  // POST /sessions/{session_id}:publish
  rpc PublishSession(PublishSessionRequest) returns (PublishSessionResponse);
  // POST /sessions/{session_id}:cancel
  rpc CancelSession(CancelSessionRequest) returns (SessionResponse);

  // worker
  rpc SetMessageId(SetMessageIdRequest) returns (SessionResponse);
}


// create
message CreateSessionRequest {
  common.RequestMeta meta = 1;
  Session session = 2;
}

// read
message GetSessionRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
}

// delete
message DeleteSessionRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
}

// update
message UpdateSessionRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
  uint64 expected_version = 3;

  oneof patch {
    UpdateBasics basics = 4;
    UpdateEvent event = 5;
    UpdateOrganization organization = 6;
    UpdateSchedule schedule = 7;
    UpdateCapacity capacity = 8;
  }
}

message UpdateBasics {
  string title = 1;
  string summary = 2;
  enums.GameSystem system = 3;
}

message UpdateEvent {
  string event_id = 1;
}

message UpdateOrganization {
  string vtt_link = 1;
  string location = 2;
  repeated string additional_links = 3;
}

message UpdateSchedule {
  google.protobuf.Timestamp starts_at = 1;
  int32 duration_minutes = 2;
  string timezone = 3;
}

message UpdateCapacity {
  int32 capacity_main = 1;      // must be >= main_active_count
}


// publish
message PublishSessionRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
}

message PublishSessionResponse {
  Session session = 1;
  string outbox_id = 2;
}

// cancel
message CancelSessionRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
}

// set message, worker-only
message SetMessageIdRequest {
  common.RequestMeta meta = 1;
  string session_id = 2;
  string message_id = 3;
  uint64 expected_version = 4;   // optional safety
}


// get list
message ListSessionsRequest {
  common.RequestMeta meta = 1;
  string guild_id = 2;
  int64 gm_user_id = 3;
  int64 user_id = 4;
  string system_id = 5;
  string event_id = 6;

  enums.SessionStatus status = 7;
  google.protobuf.Timestamp start = 8;
  google.protobuf.Timestamp end = 9;

  common.PageRequest page = 10;
}

message ListSessionsResponse {
  repeated Session items = 1;
  common.Page page = 2;
}


// models
message Session {
  string session_id = 1;
  string server_id = 2;
  string event_id = 3;
  int64 gm_user_id = 4;
  repeated string role_mentions = 5;

  string title = 6;
  string summary = 7;
  enums.GameSystem system = 8;

  string vtt_link = 9;
  string location = 10;
  repeated string additional_links = 11;

  google.protobuf.Timestamp starts_at = 12;
  int32 duration_minutes = 13;
  string timezone = 14;

  int32 capacity = 15;

  string channel_id = 16;
  string message_id = 17; // filled by worker post-publish

  enums.SessionStatus status = 18;

  repeated signups.Signup main_signups = 19;
  repeated signups.Signup reserve_signups = 20;

  common.VersionHeader version = 21;

  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

message SessionResponse {
  Session session = 1;
  common.VersionHeader version = 2;
}
