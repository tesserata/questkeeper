[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "questkeeper-api-contracts"
version = "0.1.0"
description = "Shared API contracts, DTO, protobuf"
dependencies = [
    "protobuf-to-pydantic[all]>=0.3.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qk_api_contracts"]
